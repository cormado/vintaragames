<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireWorkers</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;900&display=swap');
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Poppins', sans-serif; color: white; user-select: none; cursor: crosshair; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .header { padding: 15px; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.8); background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); pointer-events: auto; }
        .money-display { font-size: 3rem; font-weight: 900; color: #ffd700; -webkit-text-stroke: 1.5px #5a3e1b; text-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        
        /* Tienda mejorada para muchos items */
        .shop-container-wrapper {
            background: rgba(10, 15, 20, 0.95);
            border-top: 4px solid #ffd700;
            padding: 10px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        
        .shop-title {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shop { 
            display: flex; 
            justify-content: flex-start; /* Alineado a la izquierda para scroll horizontal si es necesario, o wrap */
            flex-wrap: wrap;
            gap: 8px; 
            max-height: 25vh; 
            overflow-y: auto; 
            padding-right: 10px;
            justify-content: center;
        }
        
        .shop::-webkit-scrollbar { width: 8px; } 
        .shop::-webkit-scrollbar-track { background: #222; border-radius: 4px; }
        .shop::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; border: 1px solid #222; }
        .shop::-webkit-scrollbar-thumb:hover { background: #777; }

        .shop-item { background: linear-gradient(180deg, #333, #1a1a1a); border: 1px solid #555; border-radius: 6px; padding: 5px; width: 75px; text-align: center; cursor: pointer; transition: all 0.1s; position: relative; flex-shrink: 0; }
        .shop-item:hover { transform: translateY(-3px); border-color: #fff; background: #444; z-index: 10; } 
        .shop-item:active { transform: scale(0.95); }
        .shop-item.selected { border-color: #ffd700; background: #332a00; box-shadow: 0 0 10px #ffd700; }
        .shop-item.komodo { border-color: #ff3333; background: linear-gradient(180deg, #500, #200); } 
        .shop-item.komodo.selected { background: #300; box-shadow: 0 0 15px #ff0000; }
        .shop-item.disabled { opacity: 0.3; filter: grayscale(1); }
        .shop-item h3 { margin: 0; font-size: 0.6rem; color: #ddd; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-item p { margin: 2px 0 0; font-size: 0.7rem; color: #ffd700; font-weight: bold; }
        
        .tutorial { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0.8; pointer-events: none; animation: fadeOut 5s forwards 5s; text-shadow: 0 2px 4px black; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="ui-layer">
        <div class="header">
            <div>DINERO</div>
            <div class="money-display">$<span id="money">50</span></div>
        </div>
        <div class="tutorial"><h1 style="margin:0; color:#ffd700">FireWorkers</h1><p>Click IZQ: Poner 1 | Mantener Click DER: Spamear</p></div>
        
        <div class="shop-container-wrapper">
            <div class="shop-title">Catálogo de Pirotecnia</div>
            <div class="shop" id="shop-container"></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const moneyEl = document.getElementById('money');
    const shopContainer = document.getElementById('shop-container');

    let width, height, money = 50, audioCtx = null, activeExplosions = 0;
    const GROUND_HEIGHT = 135;
    let fireworks = [], particles = [], stars = [], floatingTexts = [], dayTimeAlpha = 0;
    const mouse = { x: 0, y: 0, leftDown: false, rightDown: false };
    let selectedShopIndex = 0, isInteractingWithShop = false;

    // --- MEGA LISTA DE 32 CUETES ---
    // Shapes: 'onion', 'stick', 'triangle', 'rect', 'tower', 'tube', 'rocket', 'rocket_big', 'komodo'
    // Behaviors: 'normal', 'ground' (suelo), 'spiral' (loco), 'static' (torre), 'launch' (cohete), 'mortar' (tubo)
    
    const FIREWORK_TYPES = [
        // TIER 1: Baratos y Pequeños
        { name: "Cebollita", price: 10, reward: 15, size: 10, color: "#fff", explosionSize: 30, fuseTime: 30, shape: 'onion', behavior: 'normal', hasFlash: false },
        { name: "Ratoncito", price: 25, reward: 35, size: 10, color: "#aaa", explosionSize: 35, fuseTime: 60, shape: 'onion', behavior: 'ground', hasFlash: false },
        { name: "Brujita", price: 45, reward: 60, size: 12, color: "#0f0", explosionSize: 40, fuseTime: 80, shape: 'stick', behavior: 'ground', hasFlash: false },
        { name: "Chispita", price: 70, reward: 90, size: 15, color: "#ff0", explosionSize: 50, fuseTime: 100, shape: 'tower', behavior: 'static', hasFlash: false },
        
        // TIER 2: Aéreos Básicos
        { name: "Paloma", price: 100, reward: 130, size: 18, color: "#eee", explosionSize: 80, fuseTime: 60, shape: 'triangle', behavior: 'normal', hasFlash: false },
        { name: "Palomón", price: 180, reward: 220, size: 22, color: "#ddd", explosionSize: 100, fuseTime: 70, shape: 'triangle', behavior: 'normal', hasFlash: false },
        { name: "Buscapies", price: 250, reward: 300, size: 15, color: "#fa0", explosionSize: 90, fuseTime: 120, shape: 'stick', behavior: 'ground', hasFlash: false },
        { name: "Chiflador", price: 350, reward: 450, size: 20, color: "#0ff", explosionSize: 70, fuseTime: 80, shape: 'stick', behavior: 'spiral', hasFlash: false },
        
        // TIER 3: Explosivos Medios
        { name: "Abeja", price: 500, reward: 650, size: 15, color: "#ff0", explosionSize: 80, fuseTime: 90, shape: 'stick', behavior: 'spiral', hasFlash: false },
        { name: "R-15", price: 750, reward: 900, size: 24, color: "#f44", explosionSize: 140, fuseTime: 80, shape: 'rect', behavior: 'normal', hasFlash: false },
        { name: "Hulk", price: 1000, reward: 1250, size: 26, color: "#4f4", explosionSize: 160, fuseTime: 90, shape: 'rect', behavior: 'normal', hasFlash: false },
        { name: "Vampiro", price: 1500, reward: 2000, size: 25, color: "#300", explosionSize: 180, fuseTime: 100, shape: 'rocket', behavior: 'launch', hasFlash: false },
        
        // TIER 4: Cohetes y Volcanes
        { name: "Cohetón", price: 2200, reward: 3000, size: 30, color: "#fa0", explosionSize: 250, fuseTime: 120, shape: 'rocket', behavior: 'launch', hasFlash: false },
        { name: "Volcán", price: 3000, reward: 4000, size: 35, color: "#f80", explosionSize: 200, fuseTime: 200, shape: 'tower', behavior: 'static', hasFlash: false },
        { name: "Olla de Luz", price: 4000, reward: 5500, size: 40, color: "#f0f", explosionSize: 220, fuseTime: 220, shape: 'tower', behavior: 'static', hasFlash: false },
        { name: "Mortero", price: 5500, reward: 7500, size: 35, color: "#555", explosionSize: 350, fuseTime: 50, shape: 'tube', behavior: 'mortar', hasFlash: false },
        
        // TIER 5: Pesados
        { name: "Bazooka", price: 7500, reward: 10000, size: 40, color: "#252", explosionSize: 400, fuseTime: 60, shape: 'tube', behavior: 'mortar', hasFlash: false },
        { name: "Tomahawk", price: 10000, reward: 13000, size: 35, color: "#888", explosionSize: 450, fuseTime: 130, shape: 'rocket', behavior: 'launch', hasFlash: false },
        { name: "Cara Diablo", price: 15000, reward: 20000, size: 30, color: "#a00", explosionSize: 500, fuseTime: 80, shape: 'triangle', behavior: 'normal', hasFlash: false },
        { name: "Dinamita", price: 20000, reward: 28000, size: 20, color: "#f00", explosionSize: 600, fuseTime: 150, shape: 'stick', behavior: 'normal', hasFlash: false },
        
        // TIER 6: Estructuras y Misiles
        { name: "C-4", price: 30000, reward: 42000, size: 25, color: "#ccc", explosionSize: 700, fuseTime: 120, shape: 'rect', behavior: 'normal', hasFlash: false },
        { name: "Castillo", price: 45000, reward: 60000, size: 50, color: "#ffaa00", explosionSize: 400, fuseTime: 300, shape: 'tower', behavior: 'static', hasFlash: false },
        { name: "Torre Eiffel", price: 65000, reward: 90000, size: 55, color: "#ffd700", explosionSize: 500, fuseTime: 350, shape: 'tower', behavior: 'static', hasFlash: false },
        { name: "Saturno", price: 90000, reward: 120000, size: 45, color: "#fff", explosionSize: 600, fuseTime: 150, shape: 'rocket_big', behavior: 'launch', hasFlash: false },
        
        // TIER 7: Armas de Destrucción Masiva
        { name: "Titan", price: 150000, reward: 200000, size: 50, color: "#00f", explosionSize: 800, fuseTime: 180, shape: 'rocket_big', behavior: 'launch', hasFlash: false },
        { name: "Space-X", price: 250000, reward: 350000, size: 55, color: "#fff", explosionSize: 1000, fuseTime: 200, shape: 'rocket_big', behavior: 'launch', hasFlash: false },
        { name: "M.O.A.B.", price: 500000, reward: 750000, size: 50, color: "#343", explosionSize: 1500, fuseTime: 100, shape: 'tube', behavior: 'mortar', hasFlash: false },
        { name: "Tsar Bomba", price: 1000000, reward: 1500000, size: 60, color: "#3f3", explosionSize: 2000, fuseTime: 150, shape: 'tube', behavior: 'mortar', hasFlash: false },
        { name: "Supernova", price: 2500000, reward: 4000000, size: 20, color: "#fff", explosionSize: 3000, fuseTime: 400, shape: 'onion', behavior: 'static', hasFlash: false },
        { name: "Big Bang", price: 5000000, reward: 8000000, size: 70, color: "#000", explosionSize: 4000, fuseTime: 300, shape: 'rocket_big', behavior: 'launch', hasFlash: false },
        
        // EL REY
        { name: "KOMODO", price: 10000000, reward: 20000000, size: 60, color: "#f00", explosionSize: 5000, fuseTime: 250, shape: 'komodo', behavior: 'normal', hasFlash: true }
    ];

    function initAudio() {
        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); startAmbience(); }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function startAmbience() {
        try {
            const sz = audioCtx.sampleRate * 2; const b = audioCtx.createBuffer(1, sz, audioCtx.sampleRate); const d = b.getChannelData(0);
            let l = 0; for(let i=0;i<sz;i++){ const w=Math.random()*2-1; d[i]=(l+(0.02*w))/1.02; l=d[i]; d[i]*=3.5; }
            const n=audioCtx.createBufferSource(); n.buffer=b; n.loop=true;
            const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
            const g=audioCtx.createGain(); g.gain.value=0.05;
            n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start();
        } catch(e){}
    }
    function playSound(type, val) {
        if(!audioCtx) return;
        try {
            const t=audioCtx.currentTime;
            if(type==='explosion'){
                if(activeExplosions>5 && val<500) return; activeExplosions++; setTimeout(()=>activeExplosions--,400);
                const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
                o.frequency.setValueAtTime(100,t); o.frequency.exponentialRampToValueAtTime(0.01,t+0.5);
                g.gain.setValueAtTime(val>500?0.5:0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
                o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.5);
                const n=audioCtx.createBufferSource(); const sz=audioCtx.sampleRate; const b=audioCtx.createBuffer(1,sz,audioCtx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<sz;i++)d[i]=Math.random()*2-1;
                n.buffer=b; const ng=audioCtx.createGain(); ng.gain.setValueAtTime(val>500?1.0:0.4,t); ng.gain.exponentialRampToValueAtTime(0.01,t+0.8);
                n.connect(ng); ng.connect(audioCtx.destination); n.start(t);
            } else if(type==='fuse'){
                const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(800+Math.random()*200,t);
                g.gain.setValueAtTime(0.03,t); g.gain.linearRampToValueAtTime(0,t+0.1); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.1);
            } else if(type==='whistle'){
                const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(400,t); o.frequency.linearRampToValueAtTime(1200,t+1);
                g.gain.setValueAtTime(0.1,t); g.gain.linearRampToValueAtTime(0,t+1); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+1);
            }
        } catch(e){}
    }

    class Star { constructor(){this.x=Math.random()*width;this.y=Math.random()*(height-GROUND_HEIGHT);this.s=Math.random()*1.5;this.a=Math.random();} draw(){ctx.fillStyle=`rgba(255,255,255,${this.a})`;ctx.fillRect(this.x,this.y,this.s,this.s);} }
    class Particle {
        constructor(x,y,hue,speed,life,isKomodo=false){
            this.x=x||0;this.y=y||0; const a=Math.random()*Math.PI*2; const v=Math.random()*speed;
            this.vx=Math.cos(a)*v; this.vy=Math.sin(a)*v; this.hue=hue; this.life=life; this.maxLife=life; this.grav=0.12; this.isKomodo=isKomodo;
        }
        update(){ this.vx*=0.93; this.vy*=0.93; this.vy+=this.grav; this.x+=this.vx; this.y+=this.vy; this.life--; if(this.y>height-GROUND_HEIGHT){this.y=height-GROUND_HEIGHT;this.vy*=-0.4;} }
        draw(){
            const p=this.life/this.maxLife; 
            const l = this.isKomodo ? 100 : 50; 
            const c = this.isKomodo ? `rgba(255,255,255,${p})` : `hsla(${this.hue}, 100%, ${l}%, ${p})`;
            ctx.fillStyle=c; ctx.beginPath(); ctx.arc(this.x,this.y,(Math.random()*3+1)*p,0,Math.PI*2); ctx.fill();
        }
    }

    class Firework {
        constructor(idx,x,y){
            this.data=FIREWORK_TYPES[idx]; this.x=x||0; this.y=y||0; this.vx=0; this.vy=0; this.fuse=0; this.lit=false; this.dead=false; this.floor=height-GROUND_HEIGHT; this.rot=0; this.state='idle';
            if(this.data.behavior==='ground'||this.data.behavior==='static') this.y=this.floor-this.data.size;
        }
        update(){
            this.floor=height-GROUND_HEIGHT;
            if(this.state==='active'){
                if(this.data.behavior==='launch'||this.data.behavior==='mortar'){ this.vy-=0.45;this.x+=(Math.random()-0.5)*2; if(Math.random()>0.5)particles.push(new Particle(this.x,this.y+10,-1,1,20)); this.x+=this.vx;this.y+=this.vy; if(this.y<height*0.15||(this.vy>0&&this.y<height/2))this.explode(); }
                else if(this.data.behavior==='ground'){ this.x+=(Math.random()-0.5)*16;this.y=this.floor-5;this.fuse++;if(this.fuse>this.data.fuseTime)this.explode(); }
                else if(this.data.behavior==='spiral'){ this.vy=-5.5;this.x+=Math.sin(this.y*0.12)*6;this.y+=this.vy;if(this.y<height*0.25)this.explode(); }
                else if(this.data.behavior==='static'){ this.fuse++;if(this.fuse%6===0){playSound('fuse',0);for(let k=0;k<2;k++)particles.push(new Particle(this.x,this.y-15,Math.random()*360,7,35));} if(this.fuse>this.data.fuseTime)this.explode(); }
            } else {
                this.vy+=0.55;this.vx*=0.85;this.x+=this.vx;this.y+=this.vy; if(this.y+this.data.size>this.floor){this.y=this.floor-this.data.size;this.vy*=-0.3;}
            }
            const isHover=Math.hypot(mouse.x-this.x,mouse.y-this.y)<45;
            if(mouse.leftDown&&!isInteractingWithShop&&isHover&&this.state==='idle'){
                this.lit=true;this.fuse++;playSound('fuse',0); if(this.fuse>this.data.fuseTime){ if(this.data.behavior==='normal')this.explode(); else{this.state='active';this.fuse=0; if(this.data.behavior==='spiral')playSound('whistle',0); else playSound('fuse',0);} }
            } else { this.lit=false; if(this.fuse>0&&this.state==='idle')this.fuse--; }
        }
        explode(){
            try {
                this.dead=true; const isKomodo=this.data.hasFlash===true; playSound('explosion',this.data.explosionSize); money+=this.data.reward; updateShop();
                floatingTexts.push({x:this.x,y:this.y-50,txt:`+$${this.data.reward}`,life:60});
                if(isKomodo) dayTimeAlpha=3.0;
                const hue = isKomodo ? -1 : (this.data.color.startsWith('#')?Math.random()*360:0);
                for(let i=0;i<(isKomodo?600:this.data.explosionSize);i++) particles.push(new Particle(this.x,this.y,hue,Math.random()*(this.data.explosionSize/10),40+Math.random()*40,isKomodo));
            } catch(e){}
        }
        draw(){
            try {
                ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
                if(this.state==='idle'){ const fh=15*(1-this.fuse/this.data.fuseTime); ctx.strokeStyle='#8b5a2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-this.data.size);ctx.lineTo(0,-this.data.size-fh);ctx.stroke(); if(this.lit){ctx.fillStyle='red';ctx.beginPath();ctx.arc(0,-this.data.size-fh,3,0,Math.PI*2);ctx.fill();} }
                ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=5; ctx.fillStyle=this.data.color; const s=this.data.size;
                if(this.data.shape==='onion'){ ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();ctx.strokeStyle="red";ctx.lineWidth=2;ctx.stroke(); }
                else if(this.data.shape==='stick'){ ctx.fillStyle="#d2b48c";ctx.fillRect(-3,-s,6,s*2);ctx.fillStyle=this.data.color;ctx.fillRect(-3,-s,6,s); }
                else if(this.data.shape==='rocket'||this.data.shape==='rocket_big'){ ctx.fillRect(-s/2,-s*1.8,s,s*1.8);ctx.fillStyle='red';ctx.beginPath();ctx.moveTo(-s/2,-s*1.8);ctx.lineTo(s/2,-s*1.8);ctx.lineTo(0,-s*2.6);ctx.fill(); }
                else if(this.data.shape==='komodo'){ ctx.fillStyle="#900";ctx.fillRect(-35,-90,70,90);ctx.fillStyle="#fff";ctx.font="900 12px Arial";ctx.fillText("KOMODO",-25,-45); }
                else if(this.data.shape==='tower'){ ctx.fillStyle="#444";ctx.fillRect(-s/2,-s,s,s);ctx.fillStyle="yellow";ctx.fillRect(-s/2+5,-s+5,s-10,s-10); }
                else if(this.data.shape==='tube'){ ctx.fillStyle="#555";ctx.fillRect(-s/2,-s*1.5,s,s*1.5);ctx.fillStyle="#222";ctx.beginPath();ctx.arc(0,-s*1.5,s/2,0,Math.PI,true);ctx.fill(); }
                else ctx.fillRect(-s/2,-s,s,s*2);
                ctx.restore();
            } catch(e) { ctx.restore(); }
        }
    }

    function resize(){ width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; stars=Array(100).fill().map(()=>({x:Math.random()*width,y:Math.random()*height,s:Math.random()*2})); }
    window.addEventListener('resize', resize); resize();
    function updateShop(){
        moneyEl.innerText=money.toLocaleString(); shopContainer.innerHTML='';
        FIREWORK_TYPES.forEach((t,i)=>{
            const d=document.createElement('div'); d.className=`shop-item ${t.shape==='komodo'?'komodo':''} ${i===selectedShopIndex?'selected':''} ${money<t.price?'disabled':''}`;
            d.innerHTML=`<h3>${t.name}</h3><p>$${t.price}</p>`; d.onmousedown=(e)=>{e.stopPropagation();if(e.button===0){selectedShopIndex=i;updateShop();}}; shopContainer.appendChild(d);
        });
    }
    function spawn(idx, isSpam){ 
        try {
            const t=FIREWORK_TYPES[idx]; 
            if(money>=t.price){
                money-=t.price; updateShop();
                fireworks.push(new Firework(idx,isSpam?(mouse.x+(Math.random()-0.5)*160):mouse.x,isSpam?-40:mouse.y));
            } 
        } catch(e){}
    }
    
    shopContainer.onmouseenter=()=>isInteractingWithShop=true; shopContainer.onmouseleave=()=>isInteractingWithShop=false;
    canvas.addEventListener('mousedown',e=>{
        if(isInteractingWithShop)return;
        initAudio();
        if(e.button===0){
            mouse.leftDown=true;
            let clickingFw = false;
            for(let fw of fireworks){ if(Math.hypot(e.clientX-fw.x,e.clientY-fw.y)<45){ clickingFw=true; break; } }
            if(!clickingFw) spawn(selectedShopIndex,false);
        }
        if(e.button===2)mouse.rightDown=true; mouse.x=e.clientX; mouse.y=e.clientY;
    });
    window.addEventListener('mouseup',e=>{if(e.button===0)mouse.leftDown=false;if(e.button===2)mouse.rightDown=false;});
    window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

    let tick=0;
    function loop(){
        requestAnimationFrame(loop); tick++;
        
        ctx.setTransform(1, 0, 0, 1, 0, 0); // FIX: Reset Matrix
        ctx.globalAlpha = 1;
        
        if(mouse.rightDown && tick%5===0 && !isInteractingWithShop) spawn(selectedShopIndex,true);

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#050510'; ctx.fillRect(0,0,width,height);
        ctx.fillStyle='white'; stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));

        if(dayTimeAlpha > 0) {
            dayTimeAlpha -= 0.015; let b = Math.min(dayTimeAlpha, 1);
            ctx.fillStyle = `rgba(200, 230, 255, ${b})`; ctx.fillRect(0,0,width,height);
            if(dayTimeAlpha > 2.5) { ctx.fillStyle = `rgba(255, 255, 255, ${dayTimeAlpha - 2.5})`; ctx.fillRect(0,0,width,height); }
        }

        const gy=height-GROUND_HEIGHT;
        ctx.fillStyle=dayTimeAlpha>0.4?'#4a4':'#152515'; ctx.fillRect(0,gy+15,width,height);
        ctx.fillStyle=dayTimeAlpha>0.4?'#5c5':'#253525'; ctx.beginPath();ctx.moveTo(0,height);ctx.lineTo(0,gy);
        for(let i=0;i<=width;i+=30)ctx.quadraticCurveTo(i+15,gy-8,i+30,gy); ctx.lineTo(width,height);ctx.fill();

        ctx.globalCompositeOperation = 'lighter';
        for(let i=particles.length-1;i>=0;i--){ 
            try { particles[i].update(); particles[i].draw(); if(particles[i].life<=0)particles.splice(i,1); } catch(e){}
        }
        if(particles.length > 800) particles.splice(0, 100);

        ctx.globalCompositeOperation = 'source-over';

        for(let i=fireworks.length-1;i>=0;i--){ 
            try { fireworks[i].update(); fireworks[i].draw(); if(fireworks[i].dead)fireworks.splice(i,1); } catch(e){}
        }
        
        for(let i=floatingTexts.length-1;i>=0;i--){ const f=floatingTexts[i]; f.y-=1;f.life--; ctx.globalAlpha=Math.max(0, f.life/60); ctx.fillStyle='#fff';ctx.font="bold 18px Arial";ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; if(f.life<=0)floatingTexts.splice(i,1); }
    }
    updateShop(); loop();
</script>
</body>
</html>
